[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rumpun-backend"
version = "0.1.0"
description = "Rumpun household finance API"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "argon2-cffi>=23.1,<26",
  "email-validator>=2.1,<3",
  "fastapi>=0.115,<1",
  "google-auth>=2.29,<3",
  "psycopg[binary]>=3.1,<4",
  "pydantic-settings>=2.2,<3",
  "PyJWT>=2.8,<3",
  "requests>=2.31,<3",
  "sqlalchemy>=2.0,<3",
  "structlog>=24.1,<26",
  "uvicorn[standard]>=0.29,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.10,<2",
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.5,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501", "I001", "UP007", "UP035"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = false

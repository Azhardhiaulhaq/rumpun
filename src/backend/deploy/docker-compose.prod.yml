# Production stack for a single host whose PostgreSQL runs outside Docker.
#
# The containers share the host network so they reach PostgreSQL on loopback
# without opening it to the Docker bridge. The API binds to 127.0.0.1 only; a
# reverse tunnel or proxy on the same host publishes it over HTTPS.
#
# Configuration comes from deploy/.env.production next to this file (never
# committed). See docs/server-deployment.md.
x-backend: &backend
  build:
    context: ..
  image: rumpun-backend:latest
  env_file: .env.production
  network_mode: host
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  migrate:
    <<: *backend
    restart: "no"
    command: ["alembic", "upgrade", "head"]

  api:
    <<: *backend
    command:
      - uvicorn
      - app.main:app
      - --host=127.0.0.1
      - --port=2082
      - --no-access-log
      - --proxy-headers
      - --forwarded-allow-ips=127.0.0.1
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:2082/api/v1/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3

  gmail-worker:
    <<: *backend
    command: ["sh", "-c", "while true; do python -m app.gmail_sync; sleep 30; done"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  location-cleanup:
    <<: *backend
    command: ["python", "-m", "app.location_cleanup"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  push-worker:
    <<: *backend
    command: ["sh", "-c", "while true; do python -m app.push_worker; sleep 30; done"]
    volumes:
      - ./firebase-credentials:/firebase-credentials:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

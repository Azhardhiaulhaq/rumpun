services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rumpun
      POSTGRES_USER: rumpun
      POSTGRES_PASSWORD: local-only-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rumpun"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - rumpun-postgres:/var/lib/postgresql/data
  api:
    build: .
    environment:
      RUMPUN_ENVIRONMENT: development
      RUMPUN_DATABASE_URL: postgresql+psycopg://rumpun:local-only-password@db:5432/rumpun
      RUMPUN_JWT_SECRET: local-compose-secret-change-before-deploying
      RUMPUN_GOOGLE_CLIENT_ID: ${RUMPUN_GOOGLE_CLIENT_ID:-}
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
    depends_on:
      db:
        condition: service_healthy
volumes:
  rumpun-postgres:

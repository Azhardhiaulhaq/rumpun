name: rumpun_frontend
description: "Rumpun household finance mobile prototype."
publish_to: 'none'
version: 0.2.0+5

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  google_sign_in: ^7.2.0
  flutter_secure_storage: ^11.2.0
  url_launcher: ^6.3.2
  app_links: ^7.2.1
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.1.1

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
    - family: NotoSerif
      fonts:
        - asset: assets/fonts/NotoSerif-Regular.ttf
        - asset: assets/fonts/NotoSerif-Bold.ttf
          weight: 700
